name: Build & Push Docker Image

# GitHub Container Registry 免鉴权前提：
#   1. 仓库 Settings → Actions → Workflow permissions → 选 "Read and write permissions"
#   2. 仓库 Settings → Packages → Package settings → 允许公开或私有访问
#   3. 如果要发布到用户账户（不是仓库下），需要先 gh auth login

on:
  push:
    branches: [main, master]
    tags:
      - "v*"                # 打 tag 时发布 v1.0.0 这种镜像
  pull_request:
    branches: [main, master]
  workflow_dispatch:        # 手动点 Run workflow

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}  # 自动变成 ghcr.io/yourname/jianti-exam-system

jobs:
  build-and-push:
    name: Build & Push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write      # ← 必须，推 ghcr.io 需要
    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Docker meta (tag 策略)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .                       # 项目根
          file: ./deploy/nas/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Show image digest
        if: github.event_name != 'pull_request'
        run: |
          echo "Pushed: ${{ steps.meta.outputs.tags }}"
          echo "Digest: ${{ steps.build.outputs.digest }}"
